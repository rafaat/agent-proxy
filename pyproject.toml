[project]
name = "agent-proxy"
version = "0.1.0"
description = "Unified MCP + ACP proxy exposing local coding agents over HTTP"
readme = "README.md"
authors = [
    { name = "Rafaat Hossain", email = "rafaat123@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "anyio>=4.16.0",
    "fastapi>=0.165.0",
    "mcp>=2.3.0,<3",
    "pydantic-settings>=2.16.3",
    "pyyaml>=6.0.4",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
agent-proxy = "gateway.__main__:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.6",
]

[tool.uv.build-backend]
module-name = "gateway"
module-root = ""

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "SIM"]
ignore = ["S101", "S603", "S607"]
